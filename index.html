
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover AI tools for writing, images, coding, video and productivity.">
  <meta name="theme-color" content="#101828">
  <title>AI Tools Hub - Discover AI Tools</title>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4273007448994004"
    crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #182230;
      background: #f4f6fa;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .header {
      background: #101828;
      color: white;
      padding: 18px max(16px, calc((100% - 1200px)/2));
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo { font-size: 25px; font-weight: 800; }
    .logo span { color: #60a5fa; }
    .btn {
      border: 0;
      padding: 11px 15px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }
    .btn:hover { filter: brightness(.92); }
    .light { background: #e5e7eb; color: #111827; }
    .hero {
      text-align: center;
      padding: 40px 8px 32px;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 44px);
      margin: 0 0 12px;
    }
    .hero p { color: #d0d5dd; line-height: 1.6; }
    .search {
      display: flex;
      gap: 8px;
      max-width: 650px;
      margin: 22px auto 0;
    }
    .search input {
      width: 100%;
      min-width: 0;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      outline-color: #2563eb;
    }
    main {
      max-width: 1200px;
      margin: auto;
      padding: 24px 18px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filters button {
      border: 1px solid #d0d5dd;
      color: #344054;
      background: white;
      border-radius: 20px;
      padding: 9px 13px;
    }
    .filters button.active {
      background: #101828;
      color: white;
      border-color: #101828;
    }
    .count { color: #667085; margin: 16px 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 14px;
      padding: 19px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 12px #10182808;
    }
    .emoji { font-size: 36px; }
    .category {
      color: #2563eb;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 12px;
    }
    .card h2 { font-size: 20px; margin: 8px 0; }
    .card p { color: #667085; line-height: 1.55; flex: 1; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions a { flex: 1; text-decoration: none; }
    .actions a button { width: 100%; }
    .heart {
      background: #fce7f3;
      color: #be185d;
      min-width: 45px;
    }
    .empty {
      display: none;
      padding: 40px 10px;
      text-align: center;
    }
    .ad-space {
      margin: 20px auto;
      max-width: 970px;
      min-height: 0;
      text-align: center;
    }
    footer {
      background: #101828;
      color: #d0d5dd;
      padding: 28px 16px;
      text-align: center;
      margin-top: 28px;
    }
    footer a { color: #93c5fd; margin: 0 8px; }
    @media (max-width: 950px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 650px) {
      .header { padding: 16px; }
      .hero { padding: 30px 0 24px; }
      main { padding: 18px 12px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .card { padding: 13px; }
      .card h2 { font-size: 17px; }
      .card p { font-size: 14px; }
      .search { flex-direction: column; }
      .search .btn { width: 100%; }
      .toolbar { align-items: flex-start; }
      .filters { gap: 6px; }
      .filters button { font-size: 13px; padding: 8px 10px; }
    }
    @media (max-width: 360px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="nav">
      <div class="logo">AI <span>Tools Hub</span></div>
      <button id="language" class="btn light" type="button">বাংলা</button>
    </div>
    <section class="hero">
      <h1 id="heading">Discover the Best AI Tools</h1>
      <p id="subtitle">Find helpful AI tools for writing, images, coding, video and productivity.</p>
      <form class="search" id="searchForm">
        <input id="searchInput" type="search" placeholder="Search AI tools..." aria-label="Search AI tools">
        <button class="btn" id="searchButton" type="submit">Search</button>
      </form>
    </section>
  </header>

  <main>
    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="active" data-cat="All" type="button" id="allButton">All Tools</button>
        <button data-cat="Writing" type="button" id="writingButton">Writing</button>
        <button data-cat="Image" type="button" id="imageButton">Image</button>
        <button data-cat="Coding" type="button" id="codingButton">Coding</button>
        <button data-cat="Video" type="button" id="videoButton">Video</button>
        <button data-cat="Productivity" type="button" id="productivityButton">Productivity</button>
        <button data-cat="Favorites" type="button" id="favoriteButton">♥ Favorites</button>
      </div>
      <button class="btn light" id="resetButton" type="button">Reset</button>
    </div>

    <div class="count" id="count" aria-live="polite"></div>

    <div class="ad-space">
      <!-- Auto ads can appear here or elsewhere when enabled and approved by AdSense. -->
    </div>

    <section class="grid" id="toolGrid" aria-live="polite"></section>
    <section class="empty" id="empty">
      <h2 id="emptyHeading">No tools found</h2>
      <p id="emptyDescription">Try another keyword or category.</p>
      <button class="btn" id="showAll" type="button">Show All Tools</button>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> AI Tools Hub</p>
    <p>
      <a href="about.html" id="aboutLink">About</a>
      <a href="privacy.html" id="privacyLink">Privacy Policy</a>
      <a href="contact.html" id="contactLink">Contact</a>
    </p>
  </footer>

  <script>
    "use strict";

    const tools = [
      {name:"ChatGPT",cat:"Writing",icon:"🤖",url:"https://chatgpt.com/",en:"AI assistant for writing, learning and brainstorming.",bn:"লেখা, শেখা ও নতুন ধারণার AI সহকারী।"},
      {name:"Google Gemini",cat:"Writing",icon:"✨",url:"https://gemini.google.com/",en:"Google AI assistant for everyday tasks.",bn:"দৈনন্দিন কাজের জন্য Google-এর AI সহকারী।"},
      {name:"Claude",cat:"Writing",icon:"🧠",url:"https://claude.ai/",en:"AI assistant for writing and analysis.",bn:"লেখা ও বিশ্লেষণের AI সহকারী।"},
      {name:"Grammarly",cat:"Writing",icon:"✍️",url:"https://www.grammarly.com/",en:"Improve grammar, spelling and clarity.",bn:"ইংরেজি লেখা ও বানান ঠিক করুন।"},
      {name:"QuillBot",cat:"Writing",icon:"📝",url:"https://quillbot.com/",en:"Paraphrase and improve your writing.",bn:"লেখা নতুনভাবে সাজাতে সাহায্য করে।"},
      {name:"Writesonic",cat:"Writing",icon:"📄",url:"https://writesonic.com/",en:"AI writing and content creation.",bn:"AI দিয়ে লেখা ও কনটেন্ট তৈরি করুন।"},
      {name:"Canva",cat:"Image",icon:"🎨",url:"https://www.canva.com/",en:"Create graphics and social media designs.",bn:"গ্রাফিক্স ও সোশ্যাল মিডিয়া ডিজাইন করুন।"},
      {name:"Adobe Firefly",cat:"Image",icon:"🖼️",url:"https://firefly.adobe.com/",en:"Generate and edit images with AI.",bn:"AI দিয়ে ছবি তৈরি ও সম্পাদনা করুন।"},
      {name:"Leonardo AI",cat:"Image",icon:"🌄",url:"https://leonardo.ai/",en:"Create AI artwork and visual concepts.",bn:"AI আর্ট ও ভিজ্যুয়াল তৈরি করুন।"},
      {name:"Ideogram",cat:"Image",icon:"💡",url:"https://ideogram.ai/",en:"Generate creative images and designs.",bn:"সৃজনশীল ছবি ও ডিজাইন তৈরি করুন।"},
      {name:"Remove.bg",cat:"Image",icon:"✂️",url:"https://www.remove.bg/",en:"Remove image backgrounds.",bn:"ছবির ব্যাকগ্রাউন্ড সরান।"},
      {name:"Photoroom",cat:"Image",icon:"📸",url:"https://www.photoroom.com/",en:"Create product photos and remove backgrounds.",bn:"প্রোডাক্ট ছবি তৈরি ও ব্যাকগ্রাউন্ড সরান।"},
      {name:"GitHub Copilot",cat:"Coding",icon:"💻",url:"https://github.com/features/copilot",en:"AI help for software development.",bn:"সফটওয়্যার কোড লেখার AI সহকারী।"},
      {name:"Replit",cat:"Coding",icon:"🛠️",url:"https://replit.com/",en:"Build and run apps online.",bn:"অনলাইনে অ্যাপ তৈরি ও চালান।"},
      {name:"Cursor",cat:"Coding",icon:"⌨️",url:"https://cursor.com/",en:"AI-powered code editor.",bn:"AI-সহায়তাপ্রাপ্ত কোড এডিটর।"},
      {name:"Codeium",cat:"Coding",icon:"⚡",url:"https://codeium.com/",en:"AI coding assistance and autocomplete.",bn:"AI দিয়ে কোড লেখা ও autocomplete।"},
      {name:"Runway",cat:"Video",icon:"🎬",url:"https://runwayml.com/",en:"AI video generation and editing.",bn:"AI দিয়ে ভিডিও তৈরি ও সম্পাদনা করুন।"},
      {name:"CapCut",cat:"Video",icon:"🎞️",url:"https://www.capcut.com/",en:"Edit videos with creative tools.",bn:"সৃজনশীল ফিচার দিয়ে ভিডিও এডিট করুন।"},
      {name:"Descript",cat:"Video",icon:"🎙️",url:"https://www.descript.com/",en:"Edit video and audio using text.",bn:"টেক্সট ব্যবহার করে ভিডিও ও অডিও এডিট করুন।"},
      {name:"Notion",cat:"Productivity",icon:"📚",url:"https://www.notion.so/",en:"Organize notes, projects and tasks.",bn:"নোট, প্রজেক্ট ও কাজ গুছিয়ে রাখুন।"},
      {name:"Perplexity",cat:"Productivity",icon:"🔎",url:"https://www.perplexity.ai/",en:"AI search and research assistant.",bn:"AI দিয়ে সার্চ ও গবেষণা করুন।"},
      {name:"Otter.ai",cat:"Productivity",icon:"🎧",url:"https://otter.ai/",en:"Transcribe and summarize conversations.",bn:"কথোপকথন লিখে ও সংক্ষেপ করে।"}
    ];

    const state = {
      lang: "en",
      category: "All",
      query: "",
      favorites: new Set()
    };

    const $ = id => document.getElementById(id);
    const tr = (en, bn) => state.lang === "bn" ? bn : en;

    function render() {
      const q = state.query.trim().toLowerCase();
      const filtered = tools.filter(tool => {
        const categoryMatch =
          state.category === "All" ||
          (state.category === "Favorites"
            ? state.favorites.has(tool.name)
            : tool.cat === state.category);

        const text = `${tool.name} ${tool.cat} ${tool.en} ${tool.bn}`.toLowerCase();
        return categoryMatch && text.includes(q);
      });

      const grid = $("toolGrid");
      grid.replaceChildren();

      $("count").textContent = tr(
        `${filtered.length} tools found`,
        `${filtered.length}টি টুল পাওয়া গেছে`
      );
      $("empty").style.display = filtered.length ? "none" : "block";

      filtered.forEach(tool => {
        const card = document.createElement("article");
        card.className = "card";

        const emoji = document.createElement("div");
        emoji.className = "emoji";
        emoji.textContent = tool.icon;

        const category = document.createElement("div");
        category.className = "category";
        category.textContent = tool.cat;

        const title = document.createElement("h2");
        title.textContent = tool.name;

        const description = document.createElement("p");
        description.textContent = tr(tool.en, tool.bn);

        const actions = document.createElement("div");
        actions.className = "actions";

        const link = document.createElement("a");
        link.href = tool.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const visit = document.createElement("button");
        visit.className = "btn";
        visit.type = "button";
        visit.textContent = tr("Visit Tool ↗", "টুল খুলুন ↗");
        link.appendChild(visit);

        const fav = document.createElement("button");
        fav.type = "button";
        fav.className = "btn heart";
        fav.textContent = state.favorites.has(tool.name) ? "♥" : "♡";
        fav.setAttribute("aria-label", "Toggle favorite");

        fav.addEventListener("click", () => {
          if (state.favorites.has(tool.name)) {
            state.favorites.delete(tool.name);
          } else {
            state.favorites.add(tool.name);
          }
          render();
        });

        actions.append(link, fav);
        card.append(emoji, category, title, description, actions);
        grid.appendChild(card);
      });
    }

    function chooseCategory(category) {
      state.category = category;
      document.querySelectorAll("#filters button").forEach(button => {
        button.classList.toggle("active", button.dataset.cat === category);
      });
      render();
    }

    $("filters").addEventListener("click", event => {
      const button = event.target.closest("button[data-cat]");
      if (button) chooseCategory(button.dataset.cat);
    });

    $("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      state.query = $("searchInput").value;
      render();
    });

    $("searchInput").addEventListener("input", event => {
      state.query = event.target.value;
      render();
    });

    function reset() {
      $("searchInput").value = "";
      state.query = "";
      chooseCategory("All");
    }

    $("resetButton").addEventListener("click", reset);
    $("showAll").addEventListener("click", reset);

    $("language").addEventListener("click", () => {
      state.lang = state.lang === "en" ? "bn" : "en";
      document.documentElement.lang = state.lang === "bn" ? "bn" : "en";

      $("language").textContent = tr("বাংলা", "English");
      $("heading").textContent = tr("Discover the Best AI Tools", "সেরা AI টুল খুঁজে নিন");
      $("subtitle").textContent = tr(
        "Find helpful AI tools for writing, images, coding, video and productivity.",
        "লেখা, ছবি, কোডিং, ভিডিও ও কাজের জন্য দরকারি AI টুল খুঁজুন।"
      );
      $("searchInput").placeholder = tr("Search AI tools...", "AI টুল খুঁজুন...");
      $("searchButton").textContent = tr("Search", "খুঁজুন");
      $("allButton").textContent = tr("All Tools", "সব টুল");
      $("writingButton").textContent = tr("Writing", "লেখালেখি");
      $("imageButton").textContent = tr("Image", "ছবি");
      $("codingButton").textContent = tr("Coding", "কোডিং");
      $("videoButton").textContent = tr("Video", "ভিডিও");
      $("productivityButton").textContent = tr("Productivity", "কাজের টুল");
      $("favoriteButton").textContent = tr("♥ Favorites", "♥ পছন্দের টুল");
      $("resetButton").textContent = tr("Reset", "রিসেট");
      $("emptyHeading").textContent = tr("No tools found", "কোনো টুল পাওয়া যায়নি");
      $("emptyDescription").textContent = tr(
        "Try another keyword or category.",
        "অন্য শব্দ বা ক্যাটাগরি দিয়ে চেষ্টা করুন।"
      );
      $("showAll").textContent = tr("Show All Tools", "সব টুল দেখুন");
      $("aboutLink").textContent = tr("About", "পরিচিতি");
      $("privacyLink").textContent = tr("Privacy Policy", "গোপনীয়তা নীতি");
      $("contactLink").textContent = tr("Contact", "যোগাযোগ");
      render();
    });

    $("year").textContent = new Date().getFullYear();
    render();
  </script>
</body>
</html>
